name: release-create

# Releases @littlebigbrain/create (`npm create @littlebigbrain`) from create/.
# A canonical sync that lands a new version in create/package.json on public
# main is the release trigger.
# Already-published versions are a no-op. A new version is checked (package
# contents, a project made from each template passes its test against the
# published client, and a Python project made from each Python port passes
# its test against the published Python SDK), pauses at the protected `npm`
# environment, publishes through trusted publishing, then receives its
# create-vX.Y.Z tag and GitHub Release.
#
# The sync stages the templates in create/templates, with the client version
# they are written for (templates/versions.json), and their Python ports in
# create/python, with the Python SDK version they are written for
# (python/versions.json); the package's prepack keeps those copies. The client
# and the Python SDK publish first. The check waits up to 30 minutes for the
# client version on npm and up to 30 minutes for the Python SDK version on
# PyPI, and fails when one does not come. The client's release.yml starts
# this workflow again once the client is live, so a run that failed while the
# client waited at its gate is followed by one that can pass. A version that
# npm refuses as already published or staged passes only once it is live.

on:
  push:
    branches: [main]
    paths: [create/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: create
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        name: Detect an unpublished package version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node -e "const v=process.argv[1]; if (!/^\\d+\\.\\d+\\.\\d+([+-][0-9A-Za-z.-]+)?$/.test(v)) process.exit(1)" "$version" \
            || { echo "::error::invalid package version: $version"; exit 1; }
          [ -f templates/versions.json ] \
            || { echo "::error::create/templates/versions.json is missing: the sync stages the templates"; exit 1; }
          [ -f python/versions.json ] \
            || { echo "::error::create/python/versions.json is missing: the sync stages the Python ports"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=create-v$version" >> "$GITHUB_OUTPUT"
          if npm view "@littlebigbrain/create@${version}" version >/dev/null 2>&1; then
            echo "@littlebigbrain/create@${version} is already published; release is a no-op"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@littlebigbrain/create@${version} is not on npm; release is required"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: [preflight]
    if: ${{ needs.preflight.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    # Two waits of up to 30 minutes each (the client, the Python SDK), then the projects.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: create
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pack and check the package contents
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball="$RUNNER_TEMP/littlebigbrain-create-${VERSION}.tgz"
          tar tzf "$tarball" > "$RUNNER_TEMP/files.txt"
          FILES="$RUNNER_TEMP/files.txt" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { PYTHON_TEMPLATES, TEMPLATES, pythonModule } from "./lib/create.mjs";
            const files = readFileSync(process.env.FILES, "utf8").split("\n").filter(Boolean)
              .map((p) => p.replace(/^package\//, ""));
            const top = ["package.json", "README.md", "LICENSE"];
            const bad = files.filter((p) => !top.includes(p) && !/^(bin|lib|project|templates|python)\//.test(p));
            if (bad.length) { console.error("unexpected files in tarball:", bad); process.exit(1); }
            const cached = files.filter((p) => /__pycache__|\.pyc$/.test(p));
            if (cached.length) { console.error("Python caches in tarball:", cached); process.exit(1); }
            const folders = (dir) => [...new Set(files.filter((p) => p.startsWith(dir + "/")).map((p) => p.split("/")[1]))].sort();
            const want = ["_shared", "versions.json", ...TEMPLATES].sort();
            if (JSON.stringify(folders("templates")) !== JSON.stringify(want)) {
              console.error("templates/ holds", folders("templates"), "not", want); process.exit(1);
            }
            const ports = ["versions.json", ...PYTHON_TEMPLATES.map(pythonModule)].sort();
            if (JSON.stringify(folders("python")) !== JSON.stringify(ports)) {
              console.error("python/ holds", folders("python"), "not", ports); process.exit(1);
            }
            for (const path of ["bin/create-littlebigbrain.mjs", "lib/create.mjs", "templates/_shared/testing.ts"])
              if (!files.includes(path)) { console.error("missing from tarball:", path); process.exit(1); }
            console.log(files.length + " files");
          '
      - name: Wait for the client the templates name
        run: |
          set -euo pipefail
          client=$(node -p "require('./templates/versions.json').client")
          for attempt in $(seq 1 60); do
            if npm view "@littlebigbrain/client@${client}" version >/dev/null 2>&1; then
              echo "@littlebigbrain/client@${client} is on npm"
              exit 0
            fi
            echo "@littlebigbrain/client@${client} is not on npm yet (attempt ${attempt}/60); its release may be waiting for approval"
            sleep 30
          done
          echo "::error::@littlebigbrain/client@${client} is not on npm; release the client, then run this workflow again"
          exit 1
      - name: Create a project from each template and run its test
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/littlebigbrain-create-${VERSION}.tgz"
          client=$(node -p "require('./templates/versions.json').client")
          templates=$(node --input-type=module -e 'import { TEMPLATES } from "./lib/create.mjs"; console.log(TEMPLATES.join(" "))')
          for template in $templates; do
            dir="$RUNNER_TEMP/projects/$template"
            (cd "$RUNNER_TEMP" && npm exec --yes --package="$tarball" -- create-littlebigbrain --template "$template" "$dir")
            dependency=$(node -p "require('$dir/package.json').dependencies['@littlebigbrain/client']")
            [ "$dependency" = "^$client" ] \
              || { echo "::error::$template depends on @littlebigbrain/client $dependency, not ^$client"; exit 1; }
            (cd "$dir" && npm install --no-audit --no-fund && npm test)
          done
      - name: Wait for the Python SDK the Python ports name
        run: |
          set -euo pipefail
          sdk=$(node -p "require('./python/versions.json').littlebigbrain")
          for attempt in $(seq 1 60); do
            if curl -sf "https://pypi.org/pypi/littlebigbrain/${sdk}/json" >/dev/null; then
              echo "littlebigbrain ${sdk} is on PyPI"
              exit 0
            fi
            echo "littlebigbrain ${sdk} is not on PyPI yet (attempt ${attempt}/60); its release may be waiting for approval"
            sleep 30
          done
          echo "::error::littlebigbrain ${sdk} is not on PyPI; release the Python SDK, then run this workflow again"
          exit 1
      - name: Create a Python project from each Python port and run its test
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/littlebigbrain-create-${VERSION}.tgz"
          sdk=$(node -p "require('./python/versions.json').littlebigbrain")
          templates=$(node --input-type=module -e 'import { PYTHON_TEMPLATES } from "./lib/create.mjs"; console.log(PYTHON_TEMPLATES.join(" "))')
          for template in $templates; do
            dir="$RUNNER_TEMP/python-projects/$template"
            (cd "$RUNNER_TEMP" && npm exec --yes --package="$tarball" -- create-littlebigbrain --template "$template" --lang python "$dir")
            grep -qxF "dependencies = [\"littlebigbrain>=${sdk}\"]" "$dir/pyproject.toml" \
              || { echo "::error::the Python $template project does not depend on littlebigbrain>=${sdk}"; exit 1; }
            (cd "$dir" && python3 -m venv .venv \
              && .venv/bin/pip install --quiet -e ".[test]" "littlebigbrain==${sdk}" \
              && .venv/bin/python -m pytest -q)
          done

  publish-npm:
    needs: [preflight, check]
    if: ${{ needs.preflight.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: create
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Verify package version and client dependency
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          actual=$(node -p "require('./package.json').version")
          [ "$actual" = "$EXPECTED_VERSION" ] \
            || { echo "::error::package version $actual != expected $EXPECTED_VERSION"; exit 1; }
          client=$(node -p "require('./templates/versions.json').client")
          npm view "@littlebigbrain/client@${client}" version
      - name: Publish @littlebigbrain/create
        # Two syncs can queue two runs of one version at the gate. When npm
        # refuses this version as already published or staged, the step checks
        # that the exact version is live; so does a publish. Only a live version
        # passes, so github-release never tags a version that npm lacks.
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set +e
          set -uo pipefail
          package="@littlebigbrain/create@${EXPECTED_VERSION:?}"
          live() { [ "$(npm view "$package" version 2>/dev/null)" = "$EXPECTED_VERSION" ]; }
          if live; then
            echo "$package is already on npm; skipped"
            exit 0
          fi
          npm publish 2>&1 | tee "$RUNNER_TEMP/publish.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -qE 'code (E409|EPUBLISHCONFLICT)|[Cc]annot publish over' "$RUNNER_TEMP/publish.log" \
              || exit "$status"
            echo "::warning::npm refused $package as already published or staged"
          fi
          for attempt in $(seq 1 20); do
            live && { echo "$package is on npm"; exit 0; }
            echo "$package is not on npm yet (attempt $attempt/20)"
            sleep 15
          done
          echo "::error::$package is not on npm after 5 minutes"
          exit 1

  github-release:
    needs: [preflight, publish-npm]
    if: ${{ needs.preflight.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create the version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; nothing to do"
          else
            # --latest=false: the repository's latest release stays the client's.
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest=false
          fi
